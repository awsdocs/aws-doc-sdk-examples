cloudwatch_Scenario_OTelMetrics:
  title: Send OpenTelemetry metrics to &CW; and alarm on them with PromQL using an &AWS; SDK
  title_abbrev: Send OpenTelemetry metrics and alarm on them with PromQL
  synopsis_list:
    - Send OTLP metrics to the &CW; metrics endpoint with an OpenTelemetry Collector.
    - Start OpenTelemetry enrichment so &CW; correlates those metrics with your resources.
    - Create an alarm that evaluates a PromQL query across every series the query returns.
    - Inspect the individual series, called contributors, that put the alarm in ALARM state.
    - Mute the alarm for a maintenance window, then clean up.
  category: Scenarios
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/cloudwatch
          sdkguide:
          excerpts:
