                - python.example_code.cloudwatch.DescribeAlarmContributors
                - python.example_code.cloudwatch.PutAlarmMuteRule
                - python.example_code.cloudwatch.GetAlarmMuteRule
                - python.example_code.cloudwatch.ListAlarmMuteRules
                - python.example_code.cloudwatch.DeleteAlarmMuteRule
                - python.example_code.cloudwatch.StopOTelEnrichment
                - python.example_code.cloudwatch.otel.DeleteAlarms
            - description: Use the wrapper class to alarm on OpenTelemetry metrics with a
                PromQL query, inspect the contributors to the alarm, and mute it.
              snippet_tags:
                - python.example_code.cloudwatch.Scenario_OTelMetrics
            - description: Configure an OpenTelemetry Collector to send the OTLP metrics
