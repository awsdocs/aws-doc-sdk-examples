        - sdk_version: 4
          github: dotnetv4/CloudWatch
          sdkguide:
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - CloudWatch.dotnetv4.GettingStarted
            - description: Wrapper methods used by the scenario for &CW; actions.
              snippet_tags:
                - CloudWatch.dotnetv4.CloudWatchWrapper
