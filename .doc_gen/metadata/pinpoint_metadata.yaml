pinpoint_Scenario:
  title: Learn &AMP;Pinpoint; basics using an &AWS; SDK
  title_abbrev: Learn &AMP;Pinpoint; basics
  synopsis: learn &AMP;Pinpoint; basics.
  category: Basics
  synopsis_list:
    - Create an Amazon Pinpoint application.
    - Configure the email channel with a verified SES identity.
    - Create a segment targeting email subscribers.
    - Create and launch an email campaign.
    - Send a direct transactional email via SendMessages.
    - Retrieve campaign details and activities.
    - Clean up all resources.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/pinpoint
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.pinpoint.PinpointScenario
            - description: Create a class that wraps Amazon Pinpoint operations.
              snippet_tags:
                - python.example_code.pinpoint.PinpointWrapper.decl
  services:
    pinpoint: {CreateApp: null, UpdateEmailChannel: null, CreateSegment: null, CreateCampaign: null, SendMessages: null, GetCampaign: null, GetCampaignActivities: null, DeleteCampaign: null, DeleteSegment: null, DeleteApp: null}
