cloudwatch-logs_Scenario:
  title: Get started with &CWL; log groups and streams
  title_abbrev: Get started with log groups and streams
  synopsis: learn the basics of &CWL; by creating log groups, ingesting events, filtering, and managing retention.
  category: Scenarios
  synopsis_list:
  - Create a log group and log stream.
  - Ingest sample log events.
  - Retrieve log events from the stream.
  - Filter log events using patterns.
  - Create and verify a metric filter.
  - Configure and verify a retention policy.
  - Clean up all resources.
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/cloudwatch-logs
        excerpts:
        - description: Create a CloudWatch Logs wrapper class to manage operations.
          snippet_tags:
          - python.example_code.cloudwatch-logs.CloudWatchLogsWrapper.class
        - description: Run an interactive scenario demonstrating CloudWatch Logs basics.
          snippet_tags:
          - python.example_code.cloudwatch-logs.CloudWatchLogsScenario
  services:
    cloudwatch-logs: {CreateLogGroup: null, CreateLogStream: null, PutLogEvents: null, GetLogEvents: null, FilterLogEvents: null, PutMetricFilter: null, DescribeMetricFilters: null, PutRetentionPolicy: null, DescribeLogGroups: null, DeleteLogGroup: null}
