cloudwatch-logs_Scenario_SyslogIngestion:
  title: Learn &CWL; syslog ingestion basics using an &AWS; SDK
  title_abbrev: Learn syslog ingestion basics
  category: Scenarios
  synopsis_list:
    - Deploy a CloudFormation stack that provisions a syslog VPC endpoint.
    - Create a log group and add a resource policy for the syslog service.
    - Create a syslog configuration with PutSyslogConfiguration.
    - List syslog configurations with and without filters.
    - Clean up by deleting the syslog configuration, log group, and stack.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/cloudwatch-logs/scenarios/syslog_ingestion
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.cloudwatchlogs.SyslogScenario
            - description: Create a class that wraps &CWL; operations.
              snippet_tags:
                - python.example_code.cloudwatchlogs.CloudWatchLogsWrapper.decl
  services:
    cloudwatch-logs: {CreateLogGroup, DescribeLogGroups, PutSyslogConfiguration, ListSyslogConfigurations, DeleteSyslogConfiguration, DeleteLogGroup}
