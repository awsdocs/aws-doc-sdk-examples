ram_ShareDocuments_Scenario:
  title: Share documents with organizations and organizational units using an &AWS; SDK
  title_abbrev: Share documents with organizations
  synopsis: share documents with organizations and organizational units by using resource shares.
  category: Scenarios
  synopsis_list:
    - Create an organization and two organizational units, if the account has none.
    - Create a document to share.
    - Share the document with an organization or organizational unit by using a resource share.
    - Verify the resource share.
    - Add a second organizational unit to the resource share.
    - Compare sharing with a resource share to sharing with individual accounts, using a second document.
    - List documents to confirm visibility.
    - Clean up all resources in the correct dependency order.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/ssm/scenarios/ssm_document_sharing
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.ssm.ShareDocumentsScenario
            - description: Create a class that wraps document operations.
              snippet_tags:
                - python.example_code.ssm.SsmDocumentWrapper.decl
                - python.example_code.ssm.ModifyDocumentPermission
                - python.example_code.ssm.DescribeDocumentPermission
                - python.example_code.ssm.ListDocuments
            - description: Create a class that wraps resource share operations.
              snippet_tags:
                - python.example_code.ram.RamWrapper.decl
                - python.example_code.ram.CreateResourceShare
                - python.example_code.ram.AssociateResourceShare
                - python.example_code.ram.GetResourceShares
                - python.example_code.ram.DisassociateResourceShare
                - python.example_code.ram.DeleteResourceShare
  services:
    ram: {CreateResourceShare, AssociateResourceShare, GetResourceShares, DisassociateResourceShare, DeleteResourceShare}
