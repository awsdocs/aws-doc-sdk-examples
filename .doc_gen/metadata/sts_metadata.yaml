sts_Scenario:
  title: Learn &STS; basics using an &AWS; SDK
  title_abbrev: Learn &STS; basics
  synopsis: learn &STS; basics.
  category: Basics
  synopsis_list:
  - Verify the current caller identity with GetCallerIdentity.
  - Assume an IAM role with AssumeRole and verify the assumed identity.
  - Inspect access key ownership with GetAccessKeyInfo.
  - Get session tokens with GetSessionToken for MFA workflows.
  - Get federation tokens with GetFederationToken for federated users.
  - Demonstrate DecodeAuthorizationMessage error handling.
  - Clean up resources using CloudFormation.
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/sts
        excerpts:
        - description: Run an interactive scenario demonstrating STS basics.
          snippet_tags:
          - python.example_code.sts.STSScenario
        - description: Create a class that wraps STS operations.
          snippet_tags:
          - python.example_code.sts.STSWrapper.decl
  services:
    sts: {GetCallerIdentity: null, AssumeRole: null, GetSessionToken: null, GetFederationToken: null, GetAccessKeyInfo: null, DecodeAuthorizationMessage: null}
