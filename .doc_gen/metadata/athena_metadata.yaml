athena_Scenario:
  title: Learn &ATE; basics using an &AWS; SDK
  title_abbrev: Learn &ATE; basics
  synopsis: learn &ATE; basics.
  category: Basics
  synopsis_list:
  - Create an Athena workgroup.
  - Verify the workgroup configuration.
  - Create a database and table using DDL queries.
  - Run SELECT queries and retrieve results.
  - Create, list, and delete named queries.
  - List query executions.
  - Clean up all resources.
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/athena
        excerpts:
        - description: Run an interactive scenario at a command prompt.
          snippet_tags:
          - python.example_code.athena.AthenaScenario
        - description: Create a class that wraps Athena operations.
          snippet_tags:
          - python.example_code.athena.AthenaWrapper.decl
    Java:
      versions:
      - sdk_version: "2"
        github: javav2/example_code/athena
        sdkguide:
        excerpts:
        - description: Run an interactive scenario demonstrating &AMAthena; features.
          snippet_tags:
          - athena.java2.scenario.main
        - description: A wrapper class for &AMAthena; SDK methods.
          snippet_tags:
          - athena.java2.actions.main
  services:
    athena: {CreateWorkGroup: null, GetWorkGroup: null, StartQueryExecution: null, GetQueryExecution: null, GetQueryResults: null, ListQueryExecutions: null, CreateNamedQuery: null, GetNamedQuery: null, ListNamedQueries: null, DeleteNamedQuery: null, DeleteWorkGroup: null}
