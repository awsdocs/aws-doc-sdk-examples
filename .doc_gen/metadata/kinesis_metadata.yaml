kinesis_Scenario_GettingStarted:
  title: Learn &AWSKinesis; Data Streams basics using an &AWS; SDK
  title_abbrev: Learn the basics
  category: Basics
  synopsis_list:
  - Create a stream and wait for it to become ACTIVE.
  - List streams and verify creation.
  - Describe stream summary to get metadata.
  - List shards in the stream.
  - Batch put records using PutRecords.
  - Get a shard iterator and read records.
  - Add tags to the stream.
  - List tags for the stream.
  - Remove tags from the stream.
  - Register an enhanced fan-out consumer.
  - Deregister the consumer.
  - Clean up all resources.
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/kinesis
        excerpts:
        - description: Run the Kinesis Data Streams basics scenario.
          snippet_tags:
          - python.example_code.kinesis.Scenario
        - description: Define a wrapper class that is called by the scenario to manage Kinesis actions.
          snippet_tags:
          - python.example_code.kinesis.KinesisWrapper.decl
          - python.example_code.kinesis.ListStreams
          - python.example_code.kinesis.DescribeStreamSummary
          - python.example_code.kinesis.ListShards
          - python.example_code.kinesis.PutRecords
          - python.example_code.kinesis.GetShardIterator
          - python.example_code.kinesis.AddTagsToStream
          - python.example_code.kinesis.ListTagsForStream
          - python.example_code.kinesis.RemoveTagsFromStream
          - python.example_code.kinesis.RegisterStreamConsumer
          - python.example_code.kinesis.DeregisterStreamConsumer
    SAP ABAP:
      versions:
      - sdk_version: 1
        github: sap-abap/services/kns
        excerpts:
        - description:
          snippet_tags:
          - kns.abapv1.getting_started_with_kns
  services:
    kinesis: {CreateStream: null, ListStreams: null, DescribeStreamSummary: null, ListShards: null, PutRecord: null, PutRecords: null, GetShardIterator: null, GetRecords: null, AddTagsToStream: null, ListTagsForStream: null, RemoveTagsFromStream: null, RegisterStreamConsumer: null, DeregisterStreamConsumer: null, DeleteStream: null}
kinesis_Scenario:
  title: Learn &AKD; basics using an &AWS; SDK
  title_abbrev: Learn &AKD; basics
  synopsis: learn &AKD; basics.
  category: Basics
  synopsis_list:
  - Create a Kinesis data stream in ON_DEMAND mode.
  - Describe the stream to verify its status and configuration.
  - Tag the stream with metadata.
  - List tags on the stream with manual pagination.
  - Write a single record and a batch of records.
  - List shards with manual pagination.
  - Read records from a shard using a shard iterator.
  - Delete the stream and confirm deletion.
  languages:
    Java:
      versions:
      - sdk_version: 2
        github: javav2/example_code/kinesis
        sdkguide:
        excerpts:
        - description: Run a scenario that demonstrates Kinesis basics.
          snippet_tags:
          - kinesis.java2.scenario.main
        - description: A wrapper class for Kinesis SDK operations.
          snippet_tags:
          - kinesis.java2.actions.main
  services:
    kinesis: {CreateStream: null, DescribeStreamSummary: null, AddTagsToStream: null, ListTagsForStream: null, PutRecord: null, PutRecords: null, ListShards: null, GetShardIterator: null, GetRecords: null, DeleteStream: null}
