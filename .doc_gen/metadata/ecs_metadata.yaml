ecs_Scenario:
  title: Learn &ECS; basics using an &AWS; SDK
  title_abbrev: Learn &ECS; basics
  synopsis: learn &ECS; basics.
  category: Basics
  synopsis_list:
    - Create an ECS cluster.
    - Register a Fargate task definition.
    - Run a standalone task.
    - Create a service.
    - List tasks in the service.
    - Describe and update the service.
    - Clean up all resources.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/ecs
          sdkguide:
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.ecs.EcsScenario
            - description: Create a class that wraps ECS operations.
              snippet_tags:
                - python.example_code.ecs.EcsWrapper.decl
  services:
    ecs: {CreateCluster: null, RegisterTaskDefinition: null, DescribeClusters: null, RunTask: null, DescribeTasks: null, CreateService: null, DescribeServices: null, ListTasks: null, UpdateService: null, DeleteService: null, DeregisterTaskDefinition: null, DeleteCluster: null}
