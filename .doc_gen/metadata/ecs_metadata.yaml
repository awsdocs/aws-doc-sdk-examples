ecs_Scenario:
  title: Learn &ECS; basics
  title_abbrev: Learn the basics
  synopsis: learn &ECS; basics by deploying and managing a containerized web application using Fargate.
  synopsis_list:
  - "Create an ECS cluster with Container Insights enabled."
  - "Register a Fargate-compatible task definition."
  - "Describe the task definition to verify registration."
  - "Create an ECS service running Apache on Fargate."
  - "Wait for service stability and describe the service."
  - "List running tasks in the service."
  - "Describe task details including network configuration."
  - "Scale the service by updating the desired count."
  - "Clean up all resources (service, cluster, CloudFormation stack)."
  category: Basics
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/ecs
        excerpts:
        - description: Run an interactive scenario demonstrating ECS basics.
          snippet_tags:
          - python.example_code.ecs.EcsScenario
        - description: Create a class that wraps ECS operations.
          snippet_tags:
          - python.example_code.ecs.EcsWrapper.decl
  services:
    ecs: {CreateCluster: null, RegisterTaskDefinition: null, DescribeTaskDefinition: null, CreateService: null, DescribeServices: null, ListTasks: null, DescribeTasks: null, UpdateService: null, DeleteService: null, DeleteCluster: null}
