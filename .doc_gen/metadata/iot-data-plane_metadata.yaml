iot-data-plane_Scenario:
  title: Learn &IoTDataPlane; core operations using an &AWS; SDK
  title_abbrev: Learn IoT Data Plane core operations
  synopsis: learn core operations of the IoT Data Plane.
  category: Basics
  synopsis_list:
    - Create and manage classic (unnamed) and named device shadows.
    - Publish MQTT messages with the retain flag.
    - List and retrieve retained messages.
    - Delete shadows and clean up resources.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/iot-data-plane
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.iot-data-plane.IoTDataPlaneScenario
            - description: Create a class that wraps IoT Data Plane operations.
              snippet_tags:
                - python.example_code.iot-data-plane.IoTDataPlaneWrapper.decl
  services:
    iot-data-plane: {UpdateThingShadow, GetThingShadow, ListNamedShadowsForThing, DeleteThingShadow, Publish, ListRetainedMessages, GetRetainedMessage}
