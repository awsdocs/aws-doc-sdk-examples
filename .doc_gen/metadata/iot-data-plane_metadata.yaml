# zexi 0.4.0
# IoT Data Plane Python examples.
#
# Note: iot-data-plane_GetThingShadow and iot-data-plane_UpdateThingShadow are
# intentionally not defined here. Those two actions already have Python (SDK v3)
# entries in iot-data_metadata.yaml (python/example_code/iot). Redefining them
# here would create a duplicate example for the same language and SDK version.
# The wrapper in this example still implements both actions for use by the
# Hello and Basics scenario examples below.

iot-data-plane_DeleteThingShadow:
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/iot-data-plane
          excerpts:
            - description:
              snippet_tags:
                - python.example_code.iot-data-plane.DeleteThingShadow
  services:
    iot-data-plane: {DeleteThingShadow}

