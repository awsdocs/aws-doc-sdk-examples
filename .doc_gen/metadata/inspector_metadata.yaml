inspector_Scenario:
  synopsis_list:
    - Check Inspector account status.
    - Ensure Inspector is enabled.
    - Analyze security findings.
    - Check scan coverage.
    - Create a findings filter.
    - List existing filters.
    - Check usage and costs.
    - Get coverage statistics.
    - Delete a filter.
  category: Basics
  languages:
    Java:
      versions:
        - sdk_version: 2
          github: javav2/example_code/inspector
          sdkguide:
          excerpts:
            - description: Run an interactive scenario demonstrating &Inspector; features.
              snippet_tags:
                - inspector.java2_scenario.main
            - description: A wrapper class for &Inspector; SDK methods.
              snippet_tags:
                - inspector.java2_actions.main
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/inspector
          sdkguide:
          excerpts:
            - description: Run an interactive scenario demonstrating &Inspector; features.
              snippet_tags:
                - python.example_code.inspector2.Inspector2Scenario
            - description: A wrapper class for &Inspector; SDK methods.
              snippet_tags:
                - python.example_code.inspector2.Inspector2Wrapper.decl
                - python.example_code.inspector2.Enable
                - python.example_code.inspector2.Disable
                - python.example_code.inspector2.BatchGetAccountStatus
                - python.example_code.inspector2.ListFindings
                - python.example_code.inspector2.ListCoverage
                - python.example_code.inspector2.ListCoverageStatistics
                - python.example_code.inspector2.ListUsageTotals
                - python.example_code.inspector2.CreateFilter
                - python.example_code.inspector2.ListFilters
                - python.example_code.inspector2.DeleteFilter
                - python.example_code.inspector2.BatchGetFindingDetails
  services:
    inspector: {BatchGetAccountStatus, BatchGetFindingDetails, DeleteFilter, Enable, ListFindings, ListCoverage, CreateFilter, ListFilters, ListUsageTotals, ListCoverageStatistics}
