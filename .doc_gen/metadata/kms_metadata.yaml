kms_Scenario:
  title: Learn &KMS; basics using an &AWS; SDK
  title_abbrev: Learn the basics
  synopsis: learn &KMS; basics.
  category: Basics
  synopsis_list:
    - List existing KMS keys in the account.
    - Create a symmetric encryption KMS key and assign an alias.
    - Set a key policy and enable automatic key rotation.
    - Generate a data key for envelope encryption.
    - Re-encrypt a data key under a different KMS key.
    - Update an alias to point to a new key.
    - List key policies and disable key rotation.
    - Clean up by deleting aliases and scheduling key deletion.
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/kms
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.kms.KmsScenario
            - description: Create a class that wraps KMS operations.
              snippet_tags:
                - python.example_code.kms.KmsWrapper.decl
  services:
    kms: {ListKeys, CreateKey, CreateAlias, PutKeyPolicy, EnableKeyRotation, GenerateDataKey, ReEncrypt, UpdateAlias, ListKeyPolicies, DisableKeyRotation, DeleteAlias, ScheduleKeyDeletion}
