greengrassv2_Scenario:
  title: Learn &GG2; core operations using an &AWS; SDK
  title_abbrev: Learn &GG2; basics
  synopsis: learn core operations of &GG2; using an &AWS; SDK.
  synopsis_list:
    - List Greengrass core devices.
    - Create and version custom components from inline recipes.
    - List component versions and retrieve component recipes.
    - Describe component metadata.
    - Deploy components to a thing group with configuration overrides.
    - Get deployment details and list deployments.
    - Cancel deployments.
    - Clean up component versions and resources.
  category: Basics
  languages:
    Python:
      versions:
        - sdk_version: 3
          github: python/example_code/greengrassv2
          excerpts:
            - description: Run an interactive scenario at a command prompt.
              snippet_tags:
                - python.example_code.greengrassv2.GreengrassV2Scenario
            - description: Create a class that wraps &GG2; operations.
              snippet_tags:
                - python.example_code.greengrassv2.GreengrassV2Wrapper.decl
  services:
    greengrassv2:
      {
        ListCoreDevices,
        CreateComponentVersion,
        ListComponentVersions,
        GetComponent,
        DescribeComponent,
        CreateDeployment,
        GetDeployment,
        ListDeployments,
        CancelDeployment,
        DeleteComponent,
      }
