batch_Scenario:
  synopsis_list:
  - Create an &BATCH; compute environment.
  - Check the status of the compute environment.
  - Set up an &BATCH; job queue and job definition.
  - Register a job definition.
  - Submit an &BATCH; Job.
  - Get a list of jobs applicable to the job queue.
  - Check the status of job.
  - Delete &BATCH; resources.
  category: Basics
  languages:
    Java:
      versions:
      - sdk_version: 2
        github: javav2/example_code/batch
        sdkguide:
        excerpts:
        - description: Run an interactive scenario demonstrating &BATCH; features.
          snippet_tags:
          - batch.java2.scenario.main
        - description: A wrapper class for &BATCH; SDK methods.
          snippet_tags:
          - batch.java2.actions.main
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/batch
        excerpts:
        - description: Run an interactive scenario at a command prompt.
          snippet_tags:
          - python.example_code.batch.BatchScenario
        - description: Create a class that wraps Batch operations.
          snippet_tags:
          - python.example_code.batch.BatchWrapper.decl
  services:
    batch: {CreateComputeEnvironment: null, DeleteComputeEnvironment: null, DescribeComputeEnvironments: null, CreateJobQueue: null, ListJobsPaginator: null, DescribeJobs: null, SubmitJob: null, UpdateComputeEnvironment: null, RegisterJobDefinition: null, DescribeJobQueues: null, DeleteJobQueue: null, DeregisterJobDefinition: null, UpdateJobQueue: null}
